name: linux-gtk

# The GTK backend is the only one of this fork's platform legs that still exists after the prune
# to the GTK leg, so it is the only one with CI here. This workflow is not a supplement to the
# upstream Windows/macOS pipelines - azure-pipelines.yml and build/steps/*.yml were deleted by
# that prune, so this IS the CI for this fork.
on:
  push:
    branches: [ 5.0.0, gtk4 ]
  pull_request:
    branches: [ 5.0.0, gtk4 ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          # GitInfo derives the package version from the history; a shallow clone makes it
          # guess, and the build then emits MSB3073 "could not retrieve first commit" noise.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          # 10.0.x is the SDK everything targets. 8.0.x is installed alongside it purely to
          # carry the .NET 8 runtime, which Net4x.NuGetUtility's MSBuild tasks need: seven
          # csproj files carry that PackageReference. On Linux all three of its touch points
          # (the two NuGet.Utility.props/.targets imports and the PackageReference itself)
          # are guarded with '$(OS)' == 'Windows_NT', so this job should never load it - the
          # runtime is here so that a future un-guarding, or a Windows job added to this
          # workflow, fails on its own merits rather than on a missing framework.
          dotnet-version: |
            8.0.x
            10.0.x

      # The Net4x.* Gtk 4 bindings this backend is built on. NuGet.config declares a local source
      # at ./Packages, which on a development machine is a junction onto the GtkSharp repository's
      # BuildOutput/NugetPackages drop folder - so a cake build there publishes straight into it.
      # A junction cannot be committed, so CI has to produce the same folder for itself.
      #
      # The commit is PINNED rather than tracking a branch: the shims in that repository and the
      # backend here move together, and a floating checkout would let an unrelated push there turn
      # this job red. Bump it in the same commit that needs the new bindings.
      #
      # See docs/plans/gtk4-migration.md O1 for the alternative (publishing Net4x.* to nuget.org),
      # which is the intended end state once the compat surface stops moving.
      - name: Check out the GtkSharp bindings
        uses: actions/checkout@v4
        with:
          repository: pieroviano/GtkSharp
          ref: 624be46e647a6ef62ca11e99fe0058fc64d5eab8
          path: .gtksharp
          fetch-depth: 0

      - name: Build the Net4x.* binding packages
        working-directory: .gtksharp
        run: |
          dotnet tool restore
          dotnet cake build.cake --BuildTarget=PackageNuGet --BuildVersion=4.22.4.26225
          mkdir -p "$GITHUB_WORKSPACE/Packages"
          cp BuildOutput/NugetPackages/*.nupkg "$GITHUB_WORKSPACE/Packages/"

      # Fails loudly rather than letting restore fall through to nuget.org and resolve something
      # unrelated - a missing local source is only NU1801, a warning, as far as NuGet is concerned.
      - name: Verify the local feed
        run: |
          ls -1 Packages/Net4x.GtkSharp.*.nupkg
          test -n "$(ls -1 Packages/Net4x.*.nupkg 2>/dev/null)"

      - name: Install GTK 4, WebKitGTK, Mesa and a headless X server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libgtk-4-dev \
            libwebkitgtk-6.0-4 \
            libgl1-mesa-dri libglx-mesa0 \
            xvfb dbus-x11 fonts-dejavu-core

      # WebKitGTK 6.0, not webkit2gtk-4.1: the 4.1 series links against GTK 3 and cannot be
      # embedded in a GTK 4 widget tree at all. Controls/WebView.cs constructs its
      # WebKit.WebView inside a try/catch, so an absent runtime degrades the widget to a
      # placeholder rather than failing the build - but the renderer tests should exercise
      # the real thing.
      - name: Report native versions
        run: |
          pkg-config --modversion gtk4 || true
          ls /usr/lib/x86_64-linux-gnu/libwebkitgtk-6.0.so.4 || true

      # Debug, NOT Release, and that is forced rather than chosen. MEASURED: a Release build of
      # the solution fails outright with
      #     Xamarin.Forms.Xaml.UnitTests/XamlC/TypeReferenceExtensionsTests.cs(84,3):
      #     error CS0122: 'XamlCAssemblyResolver' is inaccessible due to its protection level
      # because Xamarin.Forms.Build.Tasks/Properties/AssemblyInfo.cs wraps its
      # [assembly: InternalsVisibleTo("Xamarin.Forms.Xaml.UnitTests")] in #if DEBUG. That is
      # upstream's arrangement, not this port's, and it means the XAML suite cannot compile in
      # Release at all. Debug is also the configuration every gate in docs/plans/gtk-linux-net10.md
      # is measured in, so CI and the plan now agree.
      - name: Build
        run: dotnet build Xamarin.Forms.Gtk.sln -c Debug

      # The two pre-existing suites are RUN AND REPORTED but do not gate this job. Nothing here
      # is skipped, filtered or weakened - the full suite runs and the .trx artifact carries
      # every result. What is scoped is which suite can fail the GTK job, and that is the GTK
      # one below, which is deterministic (159/159 over three consecutive runs, including under
      # G_DEBUG=fatal-criticals). That count is now 169: 168 passed / 1 skipped over ten
      # consecutive runs on WINDOWS (2026-08-02) - the skip is the deliberately disabled
      # M3-residual repro in LayoutTests, not an environment skip. RE-MEASURED ON LINUX the same
      # day, under xvfb-run --server-args="-screen 0 1280x1024x24": identical, Failed 0 / Passed
      # 168 / Skipped 1 / Total 169, with zero GTK criticals, and again under
      # G_DEBUG=fatal-criticals. So the two OSes agree.
      # The Core and XAML numbers below were measured on 2026-08-01, both in Debug and in Release:
      #
      #   Core.UnitTests   WAS 4860 passed / 8 failed / 8 skipped of 4876, the 8 being GC-liveness
      #                    assertions - WeakToWeak, ElementIsGarbageCollectedAfterItsRemoved,
      #                    LayoutIsGarbageCollectedAfterItsRemoved,
      #                    SubscriberCollectableAfterUnsubscribeEvenIfHeldByClosure,
      #                    TestImageSourceToNullCancelsLoading - i.e. tests whose outcome
      #                    depends on when the runtime actually collects.
      #                    RE-MEASURED 2026-08-02, after the xUnit conversion defects and the
      #                    missing parallelisation guard were fixed: Failed 0 / Passed 4839 /
      #                    Skipped 9 / Total 4848, on Windows repeatedly and on Linux in 8 of 9
      #                    runs. So continue-on-error is REMOVED from this step - it now gates.
      #
      #                    An intermittent ~1-in-8 failure was tracked down on 2026-08-02, and it
      #                    was NOT one of the GC-liveness assertions, which had been the standing
      #                    assumption. It was TickerSystemEnabledTests.DisablingTicker* in
      #                    MotionTests.cs: those disabled the animation ticker after a fixed
      #                    Task.Delay(32) and then asserted the in-flight animation had been
      #                    finished off. Isolated they passed 12/12, but under the load of the full
      #                    4848-test suite the delay could elapse before the animation started
      #                    ticking, leaving nothing to finish. They now wait on the animation's own
      #                    progress rather than the clock: 12/12 clean full-suite runs after.
      #                    If this step does go red intermittently again, identify and fix or
      #                    [Skip] THAT test. Do not restore continue-on-error over the whole suite:
      #                    that is what hid 4839 working tests behind 8 known-bad ones.
      #   Xaml.UnitTests   WAS FLAKY: three consecutive runs of the same binary gave 2, 11 and 3
      #                    failures out of 1046, with a DIFFERENT set each time, plus a
      #                    deterministic LoaderTests.MissingStaticResourceShouldThrow at 3/3. The
      #                    cause was cross-test global-state contamination surfacing because xUnit
      #                    does not preserve NUnit's ordering, and it was FIXED by the
      #                    assembly-level [EnsurePlatformServices] in AssemblyTestConfig.cs. That
      #                    measurement, however, predated the fix, which is why this step stayed
      #                    de-gated long after it was green.
      #                    RE-MEASURED ON LINUX 2026-08-02, after the fix: two consecutive runs of
      #                    Failed 0 / Passed 1042 / Skipped 4 / Total 1046, no failure of any kind,
      #                    MissingStaticResourceShouldThrow among them; and the isolated
      #                    order-dependence repro `--filter FullyQualifiedName~XArray` at 6/6.
      #                    So continue-on-error is REMOVED from this step - it now gates.
      #
      #
      # One caveat kept deliberately: the 2026-08-02 re-measurement was on Ubuntu 22.04 (WSL2),
      # and this job runs 24.04. If the XAML step goes red here and nobody can reproduce it
      # locally, that difference is the first thing to check - but re-gate by fixing it, not by
      # putting continue-on-error back.
      - name: Core unit tests
        run: dotnet test Xamarin.Forms.Core.UnitTests -c Debug --no-build --logger trx

      - name: XAML unit tests
        run: dotnet test Xamarin.Forms.Xaml.UnitTests -c Debug --no-build --logger trx

      # These are real GTK widgets: they need an X server, and GDK_BACKEND=x11 because the
      # GTK backend's screenshot/pixbuf paths are unsupported under Wayland. The screen has to
      # be big enough for the 800x600 test windows - xvfb-run's 640x480 default would clamp
      # them and every allocation assertion would be measuring the wrong thing.
      # XF_GTK_REQUIRE_NATIVE turns "this environment cannot host GTK" from a skip into a
      # failure. The harness skips on a machine with no display or no GTK runtime - a Windows
      # dev box has neither - but here both are installed above, so an unusable environment
      # means the xvfb or apt step silently broke, and the suite must go red rather than
      # green-by-absence.
      - name: GTK renderer tests (headless)
        env:
          GDK_BACKEND: x11
          XF_GTK_REQUIRE_NATIVE: 1
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            dotnet test Xamarin.Forms.Platform.GTK.UnitTests -c Debug --no-build --logger trx

      # Same suite, with GTK criticals promoted to fatal - the stricter gate of plan §10.2
      # coverage target 4. Kept as a separate step so a criticals-only regression is visibly
      # distinct from an assertion failure above. Verified green on this tree.
      - name: GTK renderer tests (fatal criticals)
        env:
          GDK_BACKEND: x11
          G_DEBUG: fatal-criticals
          XF_GTK_REQUIRE_NATIVE: 1
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            dotnet test Xamarin.Forms.Platform.GTK.UnitTests -c Debug --no-build --logger trx

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/*.trx'
